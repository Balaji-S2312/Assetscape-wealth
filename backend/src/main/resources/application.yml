server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  shutdown: graceful

spring:
  application:
    name: assetscape-backend
  datasource:
    url: ${JDBC_DATABASE_URL:jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:assetscape}}
    username: ${PGUSER:assetscape}
    password: ${PGPASSWORD:assetscape}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
      minimum-idle: 1
      connection-timeout: 30000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  seed-demo-data: ${SEED_DEMO_DATA:true}
  security:
    jwt-secret: ${JWT_SECRET:change-this-local-development-secret-to-at-least-32-characters}
    access-token-seconds: ${ACCESS_TOKEN_SECONDS:900}
    refresh-token-seconds: ${REFRESH_TOKEN_SECONDS:604800}
    cookie-secure: ${COOKIE_SECURE:false}
    expose-reset-token: ${EXPOSE_RESET_TOKEN:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  metrics:
    tags:
      application: assetscape-backend

logging:
  level:
    org.springframework.security: INFO
